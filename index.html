<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gatinho Samurai: Ecos Místicos</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="clean-ui">
  <!-- MENU PRINCIPAL INICIAL DO JOGO -->
  <div id="main-menu-overlay" class="main-menu-screen">
    <div class="menu-particles-bg" id="menu-particles"></div>
    <div class="menu-content-card">
      <div class="game-logo">
        <div class="logo-emblem">🐱⚔️</div>
        <h1>GATINHO SAMURAI</h1>
        <h2>ECOS MÍSTICOS</h2>
        <div class="logo-divider"><span>⛩️</span></div>
      </div>

      <div class="menu-buttons-list">
        <button id="menu-btn-new-game" class="menu-btn btn-hero">
          <span class="btn-text">NOVO JOGO</span>
        </button>

        <button id="menu-btn-load-game" class="menu-btn">
          <span class="btn-text">CONTINUAR</span>
          <span class="save-status-tag" id="main-menu-save-tag">Nenhum save</span>
        </button>

        <button id="menu-btn-options" class="menu-btn">
          <span class="btn-text">OPÇÕES</span>
        </button>

        <button id="menu-btn-studio" class="menu-btn btn-secondary">
          <span class="btn-text">ESTÚDIO DE ANIMAÇÕES</span>
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL DE OPÇÕES -->
  <div id="options-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Opções</h3>
        <button id="btn-close-options" class="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="option-row">
          <label for="opt-sfx-vol">SFX: <strong id="sfx-vol-val">80%</strong></label>
          <input type="range" id="opt-sfx-vol" min="0" max="100" value="80">
        </div>

        <div class="option-row">
          <label for="opt-bgm-vol">Música: <strong id="bgm-vol-val">70%</strong></label>
          <input type="range" id="opt-bgm-vol" min="0" max="100" value="70">
        </div>

        <div class="option-row save-management-box">
          <div class="save-actions">
            <button id="btn-modal-save-now" class="btn-sm btn-primary">Salvar Jogo</button>
            <button id="btn-modal-clear-save" class="btn-sm btn-danger">Apagar Save</button>
          </div>
          <p id="save-info-msg" class="save-info-text"></p>
        </div>
      </div>
      <div class="modal-footer">
        <button id="btn-save-options" class="btn-primary">Concluir</button>
      </div>
    </div>
  </div>

  <!-- MENU DE PAUSA (ESC) -->
  <div id="pause-menu-overlay" class="modal-overlay">
    <div class="modal-card pause-card">
      <div class="modal-header">
        <h3>PAUSA</h3>
      </div>
      <div class="pause-menu-list">
        <button id="btn-resume-game" class="menu-btn btn-hero">CONTINUAR</button>
        <button id="btn-save-game-pause" class="menu-btn">SALVAR</button>
        <button id="btn-pause-options" class="menu-btn">OPÇÕES</button>
        <button id="btn-quit-to-main" class="menu-btn btn-secondary">MENU PRINCIPAL</button>
      </div>
    </div>
  </div>

  <!-- CONTAINER PRINCIPAL DO JOGO -->
  <div class="game-viewport-wrapper">
    <!-- JOGO CANVAS -->
    <div id="tab-game" class="tab-view active">
      <div class="canvas-screen">
        <canvas id="game-canvas" width="1280" height="720"></canvas>

        <!-- HUD MINIMALISTA ESTILO HOLLOW KNIGHT -->
        <div class="hk-hud">
          <!-- Orbe / Vaso de Alma (Energia/Magia) -->
          <div class="soul-orb" id="soul-orb">
            <div class="soul-liquid" id="soul-liquid" style="height: 100%;"></div>
            <div class="soul-glass-glare"></div>
          </div>

          <div class="hud-center-stack">
            <!-- Máscaras / Cristais de Vida (Estilo Hollow Knight Masks) -->
            <div class="masks-container" id="masks-container">
              <div class="mask-unit full"></div>
              <div class="mask-unit full"></div>
              <div class="mask-unit full"></div>
              <div class="mask-unit full"></div>
              <div class="mask-unit full"></div>
            </div>

            <!-- Contador Sutil de Colecionáveis (Geo / Pergaminhos) -->
            <div class="scroll-counter">
              <span class="scroll-icon">📜</span>
              <span class="scroll-number" id="hk-scroll-count">0</span>
            </div>
          </div>
        </div>

        <div class="save-toast" id="save-toast">Salvo</div>

        <!-- Botão discreto para alternar para o Estúdio -->
        <button id="btn-switch-studio" class="btn-corner-tool" title="Estúdio de Animações">🎬</button>
      </div>
    </div>

    <!-- ESTÚDIO DE ANIMAÇÕES -->
    <div id="tab-studio" class="tab-view">
      <div class="studio-topbar">
        <button id="btn-back-to-game" class="btn-tool btn-primary">◀ Voltar ao Jogo</button>
        <h2 id="current-anim-name">IDLE</h2>
      </div>
      <div class="studio-layout">
        <aside class="anim-sidebar">
          <div class="anim-cards">
            <button class="anim-card active" data-anim="idle">IDLE</button>
            <button class="anim-card" data-anim="walk">WALK</button>
            <button class="anim-card" data-anim="run">RUN</button>
            <button class="anim-card" data-anim="jump">JUMP</button>
            <button class="anim-card" data-anim="attack">ATTACK</button>
            <button class="anim-card" data-anim="turn">TURN</button>
          </div>
        </aside>

        <main class="studio-viewport-panel">
          <div class="stage-container" id="stage-box">
            <canvas id="studio-canvas" width="600" height="380"></canvas>
          </div>

          <div class="timeline-bar">
            <div class="timeline-controls">
              <button id="btn-prev-frame" class="btn-tool">⏮️</button>
              <button id="btn-play-pause" class="btn-tool btn-primary">⏸️</button>
              <button id="btn-next-frame" class="btn-tool">⏭️</button>
              <button id="btn-restart" class="btn-tool">🔄</button>
            </div>
            <div class="timeline-scrubber">
              <div class="scrub-track" id="scrub-track"></div>
            </div>
          </div>

          <div class="frames-strip-container">
            <div class="frame-thumbnails" id="frame-thumbs"></div>
          </div>
        </main>
      </div>
    </div>
  </div>

  <script src="assets_bundle.js"></script>
  <script src="game.js"></script>
</body>
</html>
